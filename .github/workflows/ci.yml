name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # Spec §16.3: pull-request CI on free public-repo standard runners.
  # Fast, stack-independent checks.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Clean install from lockfile (§16.3)
        run: npm ci
      - name: Type check (§16.3)
        run: npm run typecheck
      # The Edge Functions are the authoritative write path and the projection
      # engine, and `npm run typecheck` covers only the npm packages — so
      # nothing compiled them until now. Deno checks them against the same
      # shared engine sources the browser uses.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type check Edge Functions (§12, §16.3)
        run: npm run typecheck:functions
      - name: Unit and property tests (§16.3)
        run: npx vitest run
      - name: Production web build (§16.3)
        run: npm run build --workspace apps/web --if-present
      - name: Initial JavaScript budget (§19.1)
        run: npm run test:bundle-budget
      - name: CSP, security headers, and secret scan (§13, §23.3)
        run: npm run test:security
      - name: Static source lint (§16.3)
        run: npm run lint

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Clean install from lockfile (§16.3)
        run: npm ci
      - name: Start local Supabase (§16.3)
        run: npm run backend:start
      - name: Verify atomic portable restore on a fresh target
        run: |
          npx supabase db reset --local --no-seed --yes
          npm run test:restore:fresh
      - name: Verify first owner bootstrap in a fresh project
        run: |
          npx supabase db reset --local --no-seed --yes
          npm run test:bootstrap:fresh
      - name: Apply migrations and seed (§16.3)
        run: npm run backend:seed
      - name: Verify first owner attachment to an existing league
        run: npm run test:bootstrap:existing
      - name: Restore clean integration fixture after one-time bootstrap test
        run: npm run backend:seed
      - name: Database, Edge Function, and RLS integration tests (§20.1)
        run: npm run test:integration
      - name: Install supported Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Desktop/mobile browser and axe matrix (§18, §20.1)
        run: npm run test:e2e
      - name: Stop local Supabase
        if: always()
        run: npx supabase stop --no-backup

  # Spec §16.3 dependency provenance/audit and §13.2 license gate.
  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Clean install from lockfile (§16.3)
        run: npm ci
      - name: Dependency tree integrity (§16.3)
        run: npm ls --all --json > /dev/null
      - name: Dependency license allow-list (§13.2)
        run: npm run test:licenses
