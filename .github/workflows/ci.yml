name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # Spec §16.3: pull-request CI on free public-repo standard runners.
  # Fast, stack-independent checks.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Clean install from lockfile (§16.3)
        run: npm ci
      - name: Type check (§16.3)
        run: npm run typecheck
      - name: Unit and property tests (§16.3)
        run: npx vitest run
      - name: Production web build (§16.3)
        run: npm run build --workspace apps/web --if-present
      - name: Static source lint (§16.3)
        run: npm run lint

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Clean install from lockfile (§16.3)
        run: npm ci
      - name: Start local Supabase (§16.3)
        run: npm run backend:start
      - name: Apply migrations and seed (§16.3)
        run: npm run backend:seed
      - name: Database, Edge Function, and RLS integration tests (§20.1)
        run: npm run test:integration
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Phase 1 browser and axe smoke (§16.3, §20.1)
        run: npm run test:e2e -- --project=chromium
      - name: Stop local Supabase
        if: always()
        run: npx supabase stop --no-backup

  # Spec §16.3 dependency provenance/audit and §13.2 license gate.
  # The license scan gate remains manual until an ADR selects a scanner.
  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Clean install from lockfile (§16.3)
        run: npm ci
      - name: Dependency tree integrity (§16.3)
        run: npm ls --all --json > /dev/null
      - name: License scan gate placeholder (§13.2)
        run: echo "License scan gate (spec §13.2) is completed manually until the tooling decision lands in an ADR."
